name: test-case-generator
description: Turn a user story into a concise, review-ready QA test plan
model: openai/gpt-4.1
modelParameters:
  temperature: 0.2
messages:
  - role: system
    content: >-
      You are a pragmatic senior QA engineer. Return valid JSON only. Cover the
      happy path, meaningful negative cases, boundaries, and accessibility.
      Separate assumptions from known requirements and avoid duplicate cases.
  - role: user
    content: "{{story}}"
testData:
  - story: A signed-in user can update their delivery address.
    expected: The result contains at least one positive and one negative test case.

